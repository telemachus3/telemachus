name: tests

# The release workflow refuses to publish unless this has passed on the tagged
# commit. A version that reaches PyPI cannot be replaced, only yanked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # invoked by release.yml before it builds anything

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares (requires-python >= 3.10); the
        # ceiling is whatever is current. Testing only the middle is how a
        # package acquires a floor it no longer supports.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-sdk/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        env:
          # Client, partner, private-repository and device names that must never
          # appear in anything this repository publishes. Kept in a secret rather
          # than in the test file: a guard that lists the names it protects has
          # leaked them itself. Without it the client-data check SKIPS, and a
          # dedicated test fails in CI so the skip cannot pass for a pass.
          TELEMACHUS_PRIVATE_TERMS: ${{ secrets.TELEMACHUS_PRIVATE_TERMS }}
        run: pytest -q

      - name: Lint the code this release added
        # The legacy v0.1 modules deprecated in 1.0 carry pre-existing findings
        # and are scheduled for removal; gating on them would mean either fixing
        # code that is leaving or turning the gate off.
        run: |
          ruff check \
            telemachus/__init__.py telemachus/_api.py telemachus/cli.py \
            telemachus/core/accounting.py telemachus/core/carrier.py \
            telemachus/core/multirate.py telemachus/core/plausibility.py \
            telemachus/core/units.py \
            telemachus/adapters/ telemachus/analysis/ telemachus/metrics/ \
            tests/

  conformance:
    # Every dataset this project publishes must pass the validator this project
    # ships. 0.9 was tagged with all four failing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ./python-sdk
      - name: Validate every published manifest
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import telemachus as tele

          failed = False
          for manifest in sorted(Path("datasets").glob("*/manifest.yaml")):
              report = tele.validate_manifest(manifest)
              print(f"{'ok  ' if report.ok else 'FAIL'}  {manifest}")
              for error in report.errors:
                  print(f"        {error}")
              failed |= not report.ok
          sys.exit(1 if failed else 0)
          PY
