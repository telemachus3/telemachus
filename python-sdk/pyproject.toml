[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemachus"
version = "1.0.0a1"
description = "Open Parquet-native format for high-frequency telematics data (GNSS+IMU). Read, validate, and convert datasets."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [{name = "Sébastien Edet", email = "sebastien.edet@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["telematics", "gnss", "imu", "accelerometer", "parquet", "open-data", "vehicle-dynamics", "mobility"]
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.1",
    "pyarrow>=16.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.22"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://telemachus3.org"
Documentation = "https://telemachus3.org"
Repository = "https://github.com/telemachus3/telemachus"
Issues = "https://github.com/telemachus3/telemachus/issues"
Changelog = "https://github.com/telemachus3/telemachus/blob/main/CHANGELOG.md"

[project.scripts]
tele = "telemachus.cli:tele"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff>=0.12",
    "ipykernel"
]
viz = [
    "matplotlib"
]
geo = [
    "geopandas",
    "shapely",
    "pyproj"
]

[tool.setuptools.packages.find]
include = ["telemachus*"]

# Explicit rule set and a pinned floor. An unconfigured linter means "whatever
# the latest version thinks today", which is how a green build turns red with
# nobody having touched the code — it happened on the first CI run of 1.0, where
# a newer ruff than the author's enabled import sorting and reported 56
# findings in files nobody had edited.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length: the prose in these modules is the documentation
    "B008",   # call in default argument: intentional in the CLI decorators
]

[tool.ruff.lint.per-file-ignores]
# The v0.1 modules deprecated in 1.0 are scheduled for removal in 1.1. Bringing
# them up to the current rule set would mean editing code that is leaving.
"telemachus/io.py" = ["ALL"]
"telemachus/io_import.py" = ["ALL"]
"telemachus/io_export.py" = ["ALL"]
"telemachus/models.py" = ["ALL"]
"telemachus/_validate_legacy.py" = ["ALL"]
"telemachus/core/models.py" = ["ALL"]
"telemachus/core/dataset.py" = ["ALL"]
"telemachus/core/semantics.py" = ["ALL"]
"telemachus/core/validate_tables.py" = ["ALL"]
"telemachus/pandas/*" = ["ALL"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
